# Her commit ve pull request'te testler (herkese açık örnek veriyle; yayımlanmamış görüntüler gerektirenler atlanır).
# Masaüstü bağımlılıkları (PySide6) da kurulur: arayüz testleri ekransız (offscreen) çalışır.
name: Tests
on:
  push:
  pull_request:
env:
  PYTHONUTF8: "1"   # Windows konsolunda ✅ ve Türkçe karakterler
  QT_QPA_PLATFORM: offscreen   # pencere açmadan Qt
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - if: runner.os == 'Linux'   # Qt'nin çalışma kitaplıkları (masaüstü kurulumunda zaten bulunur)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: uv venv --python 3.12 .venv && uv pip install --python .venv -r requirements-desktop.txt
        shell: bash
      - run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.venv/Scripts/python; else PY=.venv/bin/python; fi
          $PY tests/test_core.py
        shell: bash

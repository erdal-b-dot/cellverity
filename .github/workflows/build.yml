# Bağımsız programları GitHub'ın sunucularında derler (elle başlatılır: Actions ▸ Build ▸ Run workflow).
# Çıktılar: Windows .zip ve macOS Intel .zip (Artifacts). Private repoda aylık ücretsiz dakika kotasından düşer.
name: Build
on:
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-13
            name: mac_Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12 .build && uv pip install --python .build -r requirements-desktop.txt pyinstaller==6.16.0
        shell: bash
      - run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PI=.build/Scripts/pyinstaller; else PI=.build/bin/pyinstaller; fi
          $PI --noconfirm --clean --distpath dist --workpath build icc_ctcf.spec
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ICC_CTCF_Olcer_${{ matrix.name }}
          path: dist/

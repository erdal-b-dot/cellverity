# Bağımsız programları GitHub'ın sunucularında derler (elle başlatılır: Actions ▸ Build ▸ Run workflow).
# Çıktılar (Artifacts): Windows .zip, macOS Intel .zip, Linux AppImage + tar.gz (x86_64, aarch64).
name: Build
on:
  workflow_dispatch:
env:
  PYTHONUTF8: "1"   # Windows konsolunda Türkçe karakterler (öz-test çıktısı)
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-15-intel   # macos-13 emekliye ayrıldı (2026-11-02 işi kuyrukta kaldı)
            name: mac_Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv venv --python 3.12 .build && uv pip install --python .build -r requirements-desktop.txt pyinstaller==6.16.0
        shell: bash
      - run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PI=.build/Scripts/pyinstaller; else PI=.build/bin/pyinstaller; fi
          $PI --noconfirm --clean --distpath dist --workpath build cellverity.spec
        shell: bash
      - name: Öz-test (paketlenmiş program)
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then EXE=dist/CellVerity/CellVerity.exe; else EXE=dist/CellVerity.app/Contents/MacOS/CellVerity; fi
          "$EXE" --selftest examples/PARC_control/Image_11305.jpg examples/PARC_control/Image_11306.jpg || true
          cat selftest_result.json
          python3 -c "import json; r = json.load(open('selftest_result.json')); assert r['cells'] == 47 and r['nuclei'] == 46 and r['package_ok'], r; print('Öz-test GEÇTİ / Self-test PASSED')"
          rm -f selftest_result.json
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: CellVerity_${{ matrix.name }}
          path: dist/

  # Linux x86_64: Ubuntu 22.04 (glibc 2.35 → Ubuntu 22.04+, Debian 12+, Fedora 36+); aarch64: Ubuntu 24.04.
  # Öz-test ekransız çalışır; AppImage + tar.gz üretir.
  linux:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            name: Linux_x86_64
          - os: ubuntu-24.04-arm   # PySide6 arm64 tekerleği glibc 2.39 istiyor
            name: Linux_aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: ./build_linux.sh --native
      - uses: actions/upload-artifact@v7
        with:
          name: CellVerity_${{ matrix.name }}
          path: |
            dist/CellVerity_*_Linux_*.AppImage
            dist/CellVerity_*_Linux_*.tar.gz
